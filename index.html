<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>body{background-color:white;}</style>

  <meta charset="utf-8"/>
  <style>
      body { margin: 0; font-family: Arial, sans-serif; }
      .tab { cursor: pointer; padding: 10px; background: #ddd; display: inline-block; margin-right: 4px; }
      .tab.active { background: #bbb; }
      .tab-content { display: none; width: 100vw; height: 90vh; }
      .tab-content.active { display: block; }
      iframe { width: 100%; height: 100%; border: none; }
    </style>
  <script>
      function showTab(tabIndex) {
        var tabs = document.querySelectorAll('.tab');
        var contents = document.querySelectorAll('.tab-content');
        tabs.forEach(function(tab, i) {
          tab.classList.toggle('active', i === tabIndex);
          contents[i].classList.toggle('active', i === tabIndex);
        });
      }
      window.onload = function() {
        showTab(0);
      };
    </script>
</head>
<html>
  <body>
    <div>
      <div class="tab active" onclick="showTab(0)">Species Richness</div>
      <div class="tab" onclick="showTab(1)">Species Accumulation Curve</div>
      <div class="tab" onclick="showTab(2)">Species List</div>
      <div class="tab" onclick="showTab(3)">Weekly Bar Charts</div>
      <div class="tab" onclick="showTab(4)">Call Timing</div>
    </div>
    <div class="tab-content active">
      <iframe src="species_richness.html"></iframe>
    </div>
    <div class="tab-content">
      <iframe src="species_accumulation.html"></iframe>
    </div>
    <div class="tab-content">
      <iframe src="species_list.html"></iframe>
    </div>
    <div class="tab-content">
      <iframe src="weekly_bar_charts.html"></iframe>
    </div>
    <div class="tab-content">
      <iframe src="call_timing.html"></iframe>
    </div>
  </body>
</html>
</html>
